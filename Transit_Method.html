<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Transit Method & Orbital Period Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h2 { color: #38bdf8; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 20px; text-align: center; max-width: 800px; }
    
    #container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 850px;
    }

    .canvas-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      border-radius: 4px;
    }

    .controls {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      color: #cbd5e1;
    }

    input[type=range] {
      width: 150px;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .toggle-group input {
      transform: scale(1.2);
      cursor: pointer;
    }

    .info-badge {
      font-size: 11px;
      color: #f59e0b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Exoplanet Transit Method & Period Simulator</h2>
  <p class="subtitle">Observe how planet size dictates transit <strong>depth</strong> (brightness dip) while orbital radius dictates transit <strong>period</strong> (frequency of dips). Contrast cyclical orbits with random meteor transits.</p>

  <div id="container">
    
    <!-- 1. Star & Orbit Visual Canvas -->
    <div class="canvas-box">
      <canvas id="orbitCanvas" width="830" height="220"></canvas>
    </div>

    <!-- 2. Light Curve Graph Canvas -->
    <div class="canvas-box">
      <canvas id="lightCurveCanvas" width="830" height="220"></canvas>
    </div>

    <!-- 3. Control Panel -->
    <div class="controls">
      <!-- Size Control -->
      <div class="control-group">
        <label for="sizeSlider">Planet Size: <span id="sizeVal" style="color:#38bdf8;">Medium</span></label>
        <input type="range" id="sizeSlider" min="10" max="30" value="20" step="2">
      </div>

      <!-- Orbital Radius Control (Kepler's Law) -->
      <div class="control-group">
        <label for="radiusSlider">Orbital Radius (Distance): <span id="radiusVal" style="color:#38bdf8;">Medium (AU)</span></label>
        <input type="range" id="radiusSlider" min="140" max="360" value="240" step="10">
      </div>

      <!-- Meteor Toggle -->
      <div class="control-group">
        <label class="toggle-group">
          <input type="checkbox" id="meteorToggle">
          <span>Random Meteors</span>
        </label>
        <span class="info-badge">Non-periodic dips</span>
      </div>

      <!-- Action Buttons -->
      <div class="control-group" style="flex-direction: row; gap: 10px;">
        <button id="clearGraphBtn">Clear Graph</button>
        <button id="pauseBtn">Pause</button>
      </div>
    </div>

  </div>

  <script>
    const orbitCanvas = document.getElementById('orbitCanvas');
    const oCtx = orbitCanvas.getContext('2d');
    const lightCanvas = document.getElementById('lightCurveCanvas');
    const lCtx = lightCanvas.getContext('2d');

    const sizeSlider = document.getElementById('sizeSlider');
    const sizeVal = document.getElementById('sizeVal');
    const radiusSlider = document.getElementById('radiusSlider');
    const radiusVal = document.getElementById('radiusVal');
    const meteorToggle = document.getElementById('meteorToggle');
    const clearGraphBtn = document.getElementById('clearGraphBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    // Simulation State
    let isRunning = true;
    let starRadius = 55;
    let starX = orbitCanvas.width / 2;
    let starY = orbitCanvas.height / 2;

    // Planet Properties
    let planet = {
      angle: 0,
      orbitRadiusX: parseInt(radiusSlider.value),
      orbitRadiusY: parseInt(radiusSlider.value) * 0.12, // Incline angle to view orbit
      radius: parseInt(sizeSlider.value),
      speed: 0.02
    };

    // Helper to calculate orbital speed based on Kepler's 3rd Law (v ∝ 1/sqrt(r))
    function updateOrbitalSpeed() {
      const baseRadius = 240;
      const baseSpeed = 0.02;
      // Keplerian speed scaling: Speed decreases as distance increases
      planet.speed = baseSpeed * Math.sqrt(baseRadius / planet.orbitRadiusX);
    }

    // Meteors List
    let meteors = [];

    // Light Curve Data Buffer
    let brightnessData = [];
    const maxDataPoints = 450;

    // Slider Event Listeners
    sizeSlider.addEventListener('input', (e) => {
      planet.radius = parseInt(e.target.value);
      if (planet.radius <= 14) sizeVal.textContent = "Small (Earth)";
      else if (planet.radius <= 22) sizeVal.textContent = "Medium (Neptune)";
      else sizeVal.textContent = "Large (Jupiter)";
    });

    radiusSlider.addEventListener('input', (e) => {
      planet.orbitRadiusX = parseInt(e.target.value);
      planet.orbitRadiusY = planet.orbitRadiusX * 0.12; // Maintain ellipse perspective
      updateOrbitalSpeed();

      if (planet.orbitRadiusX <= 180) radiusVal.textContent = "Close (Short Period)";
      else if (planet.orbitRadiusX <= 280) radiusVal.textContent = "Medium (AU)";
      else radiusVal.textContent = "Far (Long Period)";
    });

    // Control Buttons
    clearGraphBtn.addEventListener('click', () => brightnessData = []);

    pauseBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      pauseBtn.textContent = isRunning ? "Pause" : "Resume";
      if (isRunning) animate();
    });

    // Meteor Spawner
    function maybeSpawnMeteor() {
      if (!meteorToggle.checked) return;
      if (meteors.length < 2 && Math.random() < 0.008) {
        meteors.push({
          x: -30,
          y: starY + (Math.random() * 80 - 40),
          vx: 3 + Math.random() * 3,
          vy: (Math.random() - 0.5) * 0.6,
          radius: 4 + Math.random() * 8
        });
      }
    }

    // Initialize Speed
    updateOrbitalSpeed();

    // Main Loop
    function animate() {
      if (!isRunning) return;

      // Update Planet Angle
      planet.angle += planet.speed;
      if (planet.angle > Math.PI * 2) planet.angle -= Math.PI * 2;

      const planetX = starX + planet.orbitRadiusX * Math.cos(planet.angle);
      const planetY = starY + planet.orbitRadiusY * Math.sin(planet.angle);
      const isPlanetInFront = Math.sin(planet.angle) > 0;

      // Update Meteors
      maybeSpawnMeteor();
      for (let i = meteors.length - 1; i >= 0; i--) {
        let m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        if (m.x > orbitCanvas.width + 50) meteors.splice(i, 1);
      }

      // Calculate Light Dimming
      let totalBlockedArea = 0;
      const starArea = Math.PI * starRadius * starRadius;

      if (isPlanetInFront) {
        const distToStarCenter = Math.hypot(planetX - starX, planetY - starY);
        if (distToStarCenter < starRadius + planet.radius) {
          totalBlockedArea += Math.PI * planet.radius * planet.radius;
        }
      }

      meteors.forEach(m => {
        const dist = Math.hypot(m.x - starX, m.y - starY);
        if (dist < starRadius + m.radius) {
          totalBlockedArea += Math.PI * m.radius * m.radius;
        }
      });

      let currentBrightness = 1.0 - (totalBlockedArea / starArea);
      currentBrightness = Math.max(0.7, currentBrightness);

      brightnessData.push({
        val: currentBrightness,
        hasMeteor: meteors.length > 0 && totalBlockedArea > (Math.PI * planet.radius * planet.radius)
      });

      if (brightnessData.length > maxDataPoints) brightnessData.shift();

      // --- Render Viewport 1: Space Orbit ---
      oCtx.fillStyle = '#020617';
      oCtx.fillRect(0, 0, orbitCanvas.width, orbitCanvas.height);

      // Orbit Path
      oCtx.strokeStyle = 'rgba(51, 65, 85, 0.6)';
      oCtx.lineWidth = 1.5;
      oCtx.beginPath();
      oCtx.ellipse(starX, starY, planet.orbitRadiusX, planet.orbitRadiusY, 0, 0, Math.PI * 2);
      oCtx.stroke();

      // Render Planet Behind Star
      if (!isPlanetInFront) drawPlanet(oCtx, planetX, planetY, planet.radius);

      // Render Star
      oCtx.fillStyle = '#fef08a';
      oCtx.shadowColor = '#fef08a';
      oCtx.shadowBlur = 18;
      oCtx.beginPath();
      oCtx.arc(starX, starY, starRadius, 0, Math.PI * 2);
      oCtx.fill();
      oCtx.shadowBlur = 0;

      // Render Planet In Front of Star
      if (isPlanetInFront) drawPlanet(oCtx, planetX, planetY, planet.radius);

      // Render Meteors
      meteors.forEach(m => {
        oCtx.fillStyle = '#f97316';
        oCtx.shadowColor = '#f97316';
        oCtx.shadowBlur = 8;
        oCtx.beginPath();
        oCtx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        oCtx.fill();
        oCtx.shadowBlur = 0;
      });

      oCtx.fillStyle = '#cbd5e1';
      oCtx.font = '12px Segoe UI';
      oCtx.fillText("Telescope View (System Edge-On)", 15, 25);

      // --- Render Viewport 2: Light Curve ---
      drawLightCurveGraph();

      requestAnimationFrame(animate);
    }

    function drawPlanet(ctx, x, y, r) {
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawLightCurveGraph() {
      const w = lightCanvas.width;
      const h = lightCanvas.height;
      const marginL = 60;
      const marginB = 30;
      const graphW = w - marginL - 20;
      const graphH = h - marginB - 40;

      lCtx.fillStyle = '#020617';
      lCtx.fillRect(0, 0, w, h);

      // Axes
      lCtx.strokeStyle = '#334155';
      lCtx.lineWidth = 1;
      lCtx.strokeRect(marginL, 20, graphW, graphH);

      lCtx.fillStyle = '#94a3b8';
      lCtx.font = '11px Segoe UI';
      lCtx.textAlign = 'right';
      lCtx.fillText("100% Light", marginL - 8, 25);
      lCtx.fillText("95% Light", marginL - 8, 20 + graphH * 0.5);
      lCtx.fillText("90% Light", marginL - 8, 20 + graphH);

      lCtx.textAlign = 'center';
      lCtx.fillText("Time (Continuous Telescope Observation) →", marginL + graphW / 2, h - 8);

      lCtx.textAlign = 'left';
      lCtx.fillStyle = '#f8fafc';
      lCtx.font = 'bold 12px Segoe UI';
      lCtx.fillText("Star Brightness Light Curve", marginL + 10, 35);

      if (brightnessData.length < 2) return;

      lCtx.lineWidth = 2;
      lCtx.beginPath();
      const step = graphW / maxDataPoints;
      
      for (let i = 0; i < brightnessData.length; i++) {
        const x = marginL + i * step;
        const normVal = (1.0 - brightnessData[i].val) / 0.10;
        const y = 20 + normVal * graphH;

        if (i === 0) lCtx.moveTo(x, y);
        else lCtx.lineTo(x, y);
      }

      lCtx.strokeStyle = '#38bdf8';
      lCtx.stroke();

      // Legend
      lCtx.fillStyle = '#38bdf8';
      lCtx.fillText("● Dip Depth = Size  |  Dip Spacing = Orbital Period", marginL + 210, 35);
      
      if (meteorToggle.checked) {
        lCtx.fillStyle = '#f97316';
        lCtx.fillText("▲ Irregular Dips = Meteors", marginL + 560, 35);
      }
    }

    animate();
  </script>
</body>
</html>
