<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barycenter & Radial Velocity Doppler Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h2 { color: #38bdf8; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 20px; text-align: center; max-width: 800px; }
    
    #canvas-container {
      position: relative;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    canvas { display: block; border-radius: 8px; }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 15px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 15px 25px;
      border-radius: 8px;
      align-items: center;
      justify-content: space-between;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-weight: bold; font-size: 13px; color: #cbd5e1; }
    input[type=range] { width: 150px; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    
    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .toggle-group input { transform: scale(1.2); cursor: pointer; }
    .badge {
      font-size: 11px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Orbital Barycenter & Radial Velocity (Doppler) Simulator</h2>
  <p class="subtitle">
    Observe how both objects orbit their common barycenter (red cross). Toggle the observer to see how the star's wobbling velocity creates redshift (receding) and blueshift (approaching) spectrum shifts!
  </p>

  <div id="canvas-container">
    <canvas id="simCanvas" width="800" height="480"></canvas>
  </div>

  <div class="controls">
    <!-- Mass Ratio Slider -->
    <div class="control-group">
      <label for="massSlider">Star : Planet Mass: <span id="massVal" class="badge">4 : 1</span></label>
      <input type="range" id="massSlider" min="1" max="15" value="4" step="0.5">
    </div>

    <!-- Orbital Distance Slider -->
    <div class="control-group">
      <label for="distSlider">Orbital Distance: <span id="distVal" class="badge">Medium</span></label>
      <input type="range" id="distSlider" min="100" max="280" value="180" step="10">
    </div>

    <!-- Doppler Observer Toggle -->
    <div class="control-group">
      <label class="toggle-group">
        <input type="checkbox" id="observerToggle">
        <span>Stationary Observer (Doppler)</span>
      </label>
      <span class="badge" id="dopplerStatus" style="color: #94a3b8;">Observer Off</span>
    </div>

    <!-- Clear Trails -->
    <button id="toggleTrace">Clear Orbit Trails</button>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const massSlider = document.getElementById('massSlider');
    const massVal = document.getElementById('massVal');
    const distSlider = document.getElementById('distSlider');
    const distVal = document.getElementById('distVal');
    const observerToggle = document.getElementById('observerToggle');
    const dopplerStatus = document.getElementById('dopplerStatus');
    const toggleTraceBtn = document.getElementById('toggleTrace');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    let angle = 0;

    let starTrails = [];
    let planetTrails = [];

    // Listener Updates
    massSlider.addEventListener('input', (e) => {
      massVal.textContent = `${e.target.value} : 1`;
      clearTrails();
    });

    distSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      if (val < 150) distVal.textContent = "Close";
      else if (val < 230) distVal.textContent = "Medium";
      else distVal.textContent = "Far";
      clearTrails();
    });

    observerToggle.addEventListener('change', (e) => {
      if (!e.target.checked) {
        dopplerStatus.textContent = "Observer Off";
        dopplerStatus.style.color = "#94a3b8";
      }
    });

    toggleTraceBtn.addEventListener('click', clearTrails);

    function clearTrails() {
      starTrails = [];
      planetTrails = [];
    }

    // Convert RGB to CSS string
    function lerpColor(c1, c2, factor) {
      const r = Math.round(c1[0] + factor * (c2[0] - c1[0]));
      const g = Math.round(c1[1] + factor * (c2[1] - c1[1]));
      const b = Math.round(c1[2] + factor * (c2[2] - c1[2]));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const m1 = parseFloat(massSlider.value); // Star Mass
      const m2 = 1;                           // Planet Mass
      const totalDistance = parseFloat(distSlider.value);

      // Barycentric distance equations:
      // r1 = d * (m2 / (m1 + m2)),  r2 = d * (m1 / (m1 + m2))
      const r1 = totalDistance * (m2 / (m1 + m2));
      const r2 = totalDistance * (m1 / (m1 + m2));

      // Positions around center of mass (centerX, centerY)
      const starX = centerX + r1 * Math.cos(angle);
      const starY = centerY + r1 * Math.sin(angle);

      const planetX = centerX - r2 * Math.cos(angle);
      const planetY = centerY - r2 * Math.sin(angle);

      // Orbital Speed decreases with distance (Keplerian motion)
      const speed = 0.03 * Math.sqrt(180 / totalDistance);

      // Radial Velocity relative to observer positioned on the far RIGHT (Observer X = canvas.width - 50)
      // v_radial is the x-component of the star's velocity vector: -sin(angle)
      const radialVelocity = -Math.sin(angle); // Positive = moving towards right (Observer), Negative = moving left

      // Record Trails
      starTrails.push({ x: starX, y: starY });
      planetTrails.push({ x: planetX, y: planetY });
      if (starTrails.length > 300) starTrails.shift();
      if (planetTrails.length > 300) planetTrails.shift();

      // --- 1. Draw Orbit Trails ---
      ctx.lineWidth = 1.5;

      // Star Trail
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.35)';
      ctx.beginPath();
      for (let i = 0; i < starTrails.length; i++) {
        if (i === 0) ctx.moveTo(starTrails[i].x, starTrails[i].y);
        else ctx.lineTo(starTrails[i].x, starTrails[i].y);
      }
      ctx.stroke();

      // Planet Trail
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.beginPath();
      for (let i = 0; i < planetTrails.length; i++) {
        if (i === 0) ctx.moveTo(planetTrails[i].x, planetTrails[i].y);
        else ctx.lineTo(planetTrails[i].x, planetTrails[i].y);
      }
      ctx.stroke();

      // --- 2. Draw Connection Line ---
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(starX, starY);
      ctx.lineTo(planetX, planetY);
      ctx.stroke();
      ctx.setLineDash([]);

      // --- 3. Draw Barycenter ---
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(centerX, centerY, 2, 0, Math.PI * 2);
      ctx.fill();

      // --- 4. Determine Star Color (Doppler Shift vs Normal) ---
      let starColor = '#fde047'; // Default Yellow
      const yellowRGB = [253, 224, 71];
      const blueRGB   = [56, 189, 248];  // Blueshift (Approaching Observer)
      const redRGB    = [239, 68, 68];   // Redshift (Receding from Observer)

      if (observerToggle.checked) {
        // Observer is at the Right (+X direction)
        if (radialVelocity > 0.05) {
          // Moving TOWARDS observer -> Blueshift
          const factor = Math.min(1, radialVelocity);
          starColor = lerpColor(yellowRGB, blueRGB, factor);
          dopplerStatus.textContent = "BLUESHIFT (Approaching Observer)";
          dopplerStatus.style.color = "#38bdf8";
        } else if (radialVelocity < -0.05) {
          // Moving AWAY from observer -> Redshift
          const factor = Math.min(1, Math.abs(radialVelocity));
          starColor = lerpColor(yellowRGB, redRGB, factor);
          dopplerStatus.textContent = "REDSHIFT (Receding from Observer)";
          dopplerStatus.style.color = "#ef4444";
        } else {
          starColor = '#fde047';
          dopplerStatus.textContent = "NORMAL SPECTRUM (Perpendicular)";
          dopplerStatus.style.color = "#fde047";
        }
      }

      // --- 5. Draw Star ---
      const starRadius = Math.max(12, Math.min(26, 10 + m1));
      ctx.fillStyle = starColor;
      ctx.shadowColor = starColor;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(starX, starY, starRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // --- 6. Draw Planet ---
      // Planet radius scales relative to star mass ratio
      const planetRadius = Math.max(5, Math.min(14, 18 - m1));
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(planetX, planetY, planetRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // --- 7. Draw Observer Telescope (If Toggled On) ---
      if (observerToggle.checked) {
        const obsX = canvas.width - 60;
        const obsY = centerY;

        // Sight line from star to observer
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(starX, starY);
        ctx.lineTo(obsX, obsY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Telescope Icon
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(obsX, obsY, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#020617';
        ctx.font = 'bold 12px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText("🔭", obsX, obsY + 4);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '11px Segoe UI';
        ctx.fillText("Stationary", obsX, obsY - 18);
        ctx.fillText("Observer", obsX, obsY + 26);
      }

      // Labels
      ctx.fillStyle = '#f8fafc';
      ctx.font = '12px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Star', starX, starY - starRadius - 6);
      ctx.fillText('Planet', planetX, planetY - planetRadius - 6);
      ctx.fillStyle = '#ef4444';
      ctx.fillText('Barycenter', centerX, centerY + 22);

      // Advance angle
      angle += speed;

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
